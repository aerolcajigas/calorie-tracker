# calories.example.com nginx (behind a reverse proxy). __API_SECRET__ and __DASH_TOKEN__ are filled in at build time
# from ~/.calories.json. Login: PIN screen (/pin.html -> /api/login) sets cookie cal_pin = dash_token (1 year).
map_hash_bucket_size 128; # the 48-char token is longer than the default bucket allows
map $cookie_cal_pin $cal_ok { "__DASH_TOKEN__" 1; default 0; }

server {
  listen 80 default_server;
  server_name calories.example.com _;
  root /usr/share/nginx/calories;
  index index.html;

  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Cache-Control "no-store" always;

  # Resolve n8n per request so nginx starts even while n8n restarts.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $n8n http://n8n_n8n:5678;

  # Open without the cookie, but n8n only lets it try a PIN (X-Cal-Login).
  location = /api/login {
    limit_except POST { deny all; }
    client_max_body_size 4k;
    proxy_pass $n8n/webhook/calories-api;
    proxy_set_header X-Cal-Key "__API_SECRET__";
    proxy_set_header X-Cal-Login "1";
    proxy_set_header Content-Type application/json;
    proxy_read_timeout 30s;
  }

  location = /api/cal {
    if ($cal_ok = 0) { return 401; }
    limit_except POST { deny all; }
    client_max_body_size 10m; # food photos (the page shrinks them to ~0.2-0.5 MB first)
    proxy_pass $n8n/webhook/calories-api;
    proxy_set_header X-Cal-Key "__API_SECRET__";
    proxy_set_header X-Cal-Login "";
    proxy_set_header Content-Type application/json;
    proxy_read_timeout 120s;
  }

  # Phone app (Add to Home Screen): this nginx's mime.types doesn't know .webmanifest.
  location = /manifest.webmanifest { default_type application/manifest+json; }
  # Icons + PIN page stay open so the home-screen icon and the login screen load before the PIN is entered.
  location ~ ^/(icon[\w-]*\.png|pin\.html)$ { }

  location / {
    if ($cal_ok = 0) { rewrite ^ /pin.html last; }
    try_files $uri /index.html;
  }
}
